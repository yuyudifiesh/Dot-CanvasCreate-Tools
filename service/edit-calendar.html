<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日历</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #000000;
    background: #ffffff;
  }

  /* 布局 */
  .layout {
    display: flex;
    height: 100vh;
    min-height: 0;
  }
  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid #000000;
  }
  .pane-left  { flex: 0 0 300px; }
  .pane-center{
    flex: 1 1 auto;
    border-right: 1px solid #000000;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .pane-right { flex: 0 0 420px; border-right: none; }

  .pane-head {
    flex: 0 0 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid #000000;
  }
  .pane-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .pane-body {
    flex: 1 1 auto;
    overflow: auto;
    padding: 12px;
  }

  /* 表单 */
  .group {
    border: 1px solid #000000;
    border-radius: 0;
    margin-bottom: 12px;
  }
  .group-title {
    font-size: 12px;
    font-weight: 700;
    padding: 7px 10px;
    border-bottom: 1px solid #000000;
    background: #f0f0f0;
  }
  .group-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1 1 0;
    min-width: 0;
    font-size: 12px;
  }
  .field > span {
    color: #000000;
    opacity: 0.7;
  }
  select, input[type="text"], textarea {
    width: 100%;
    border: 1px solid #000000;
    border-radius: 0;
    background: #ffffff;
    color: #000000;
    font-family: inherit;
    font-size: 13px;
    padding: 0 8px;
    outline: none;
  }
  select, input[type="text"] {
    height: 30px;
  }
  textarea {
    min-height: 60px;
    padding: 6px 8px;
    line-height: 1.5;
    resize: vertical;
  }
  select:focus, input[type="text"]:focus, textarea:focus {
    background: #f0f0f0;
  }

  /* 按钮 */
  button {
    font-family: inherit;
    border-radius: 0;
    cursor: pointer;
    outline: none;
  }
  .primary-btn {
    width: 100%;
    height: 40px;
    border: 1px solid #000000;
    background: #000000;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
  }
  .primary-btn:hover  { background: #222222; }
  .primary-btn:active { background: #000000; }
  .primary-btn:disabled {
    background: #ffffff;
    color: #999999;
    border-color: #999999;
    cursor: not-allowed;
  }
  .mini-btn {
    height: 26px;
    max-width: 200px;
    padding: 0 10px;
    border: 1px solid #000000;
    background: #ffffff;
    color: #000000;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mini-btn:hover  { background: #f0f0f0; }
  .mini-btn:active { background: #e0e0e0; }
  .ghost-btn {
    height: 40px;
    padding: 0 20px;
    border: 1px solid #000000;
    background: #ffffff;
    color: #000000;
    font-size: 14px;
  }
  .ghost-btn:hover { background: #f0f0f0; }

  /* 预览 */
  .preview-wrap {
    background: #ffffff;
    border: 1px solid #000000;
    line-height: 0;
    box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.05);
  }
  #preview {
    display: block;
    background: #ffffff;
  }
  .zoom-tip {
    margin-top: 18px;
    font-size: 12px;
    color: #000000;
    opacity: 0.45;
    letter-spacing: 1px;
  }

  /* 右侧 */
  .code-box {
    flex: 1 1 auto;
    margin: 0;
    padding: 12px;
    overflow: auto;
    border-bottom: 1px solid #000000;
    background: #ffffff;
    color: #000000;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre;
    min-height: 0;
  }
  .send-wrap {
    flex: 0 0 auto;
    padding: 12px;
    border-bottom: 1px solid #000000;
  }
  .status-box {
    flex: 0 0 auto;
    min-height: 64px;
    max-height: 120px;
    overflow: auto;
    padding: 12px;
    font-size: 12px;
    line-height: 1.6;
    word-break: break-all;
  }

  /* 弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.35);
    z-index: 500;
  }
  .modal {
    width: 360px;
    background: #ffffff;
    border: 1px solid #000000;
    padding: 18px;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .modal .field { margin-bottom: 12px; }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .modal-actions .primary-btn { flex: 1 1 auto; }
  .modal-hint {
    margin-top: 10px;
    font-size: 12px;
    min-height: 16px;
    color: #000000;
    opacity: 0.7;
  }

  /* 小屏遮罩 */
  .pc-only {
    display: none;
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 900;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 16px;
    line-height: 1.8;
  }
  @media (max-width: 900px) {
    .pc-only { display: flex; }
  }
</style>
</head>
<body>

<div class="pc-only">请在 PC 上使用本工具<br><span style="font-size:13px;opacity:0.6;">最小宽度 900px</span></div>

<div class="layout">
  <!-- 左栏 -->
  <aside class="pane pane-left">
    <div class="pane-head">
      <span class="pane-title">日历设置</span>
    </div>
    <div class="pane-body">

      <div class="group">
        <div class="group-title">日历年月</div>
        <div class="group-body">
          <div class="row">
            <label class="field">
              <span>年</span>
              <select id="selYear"></select>
            </label>
            <label class="field">
              <span>月</span>
              <select id="selMonth"></select>
            </label>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="group-title">重要日期</div>
        <div class="group-body">
          <label class="field">
            <span>事项（支持换行，预览最多显示 3 行）</span>
            <textarea id="inpEvent" rows="3" maxlength="60" placeholder="例如：项目上线&#10;第二行内容"></textarea>
          </label>
          <div class="row">
            <label class="field">
              <span>月</span>
              <select id="selImpMonth"></select>
            </label>
            <label class="field">
              <span>日</span>
              <select id="selImpDay"></select>
            </label>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="group-title">底部文本</div>
        <div class="group-body">
          <label class="field">
            <span>内容</span>
            <input id="inpFooter" type="text" maxlength="30" placeholder="自定义一行小字">
          </label>
        </div>
      </div>

    </div>
  </aside>

  <!-- 中栏 -->
  <main class="pane pane-center" id="paneCenter">
    <div class="preview-wrap" id="previewWrap">
      <canvas id="preview"></canvas>
    </div>
    <div class="zoom-tip">295 × 150 · Ctrl + 滚轮缩放</div>
  </main>

  <!-- 右栏 -->
  <aside class="pane pane-right">
    <div class="pane-head">
      <span class="pane-title">JSON 预览</span>
      <button id="deviceBtn" class="mini-btn" type="button">未配置</button>
    </div>
    <pre id="codeBox" class="code-box"></pre>
    <div class="send-wrap">
      <button id="sendBtn" class="primary-btn" type="button">发送到画板</button>
    </div>
    <div id="statusBox" class="status-box">就绪</div>
  </aside>
</div>

<!-- 配置弹窗 -->
<div id="modalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-title">配置设备</div>
    <label class="field">
      <span>API 密钥</span>
      <input id="inpKey" type="text" placeholder="Bearer Token">
    </label>
    <label class="field">
      <span>设备序列号</span>
      <input id="inpDevice" type="text" placeholder="Device ID">
    </label>
    <div class="modal-actions">
      <button id="cancelBtn" class="ghost-btn" type="button">取消</button>
      <button id="saveBtn" class="primary-btn" type="button">保存</button>
    </div>
    <div id="modalHint" class="modal-hint"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 1. 常量
   * ============================================================ */
  const CANVAS_W = 295;
  const CANVAS_H = 150;
  const LEFT_W = 196;                        // 日历区宽度（约 2/3）
  const RIGHT_W = CANVAS_W - LEFT_W;         // 右栏宽度（约 1/3）
  const BOTTOM_H = 28;                       // 底部文本行高（再次加大）
  const CAL_H = CANVAS_H - BOTTOM_H;         // 日历区可视高度 122

  const STORAGE_KEY = 'dot_calendar_config'; // 密钥 + 序列号
  const SCENE_KEY = 'dot_calendar_scene';    // 场景数据

  /* 周顺序：日一二三四五六 */
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  const GRID_START_X = 8;
  const GRID_COL_W = (LEFT_W - GRID_START_X * 2) / 7;
  const GRID_TOP = 52;                       // 日期网格顶部
  const GRID_ROW_H = 11;

  /* 右栏：事项区与日期区上下 2:1 */
  const EVENT_BOX_TOP = 0;
  const EVENT_BOX_H = Math.round(CAL_H * 2 / 3);   // ≈ 81
  const DATE_BOX_TOP = EVENT_BOX_H;
  const DATE_BOX_H = CAL_H - EVENT_BOX_H;          // ≈ 41
  const EVENT_MAX_LINES = 3;

  /* 字号（预览与 JSON 共用） */
  const FS_MONTH = 26;                       // 月份数字，保持较大
  const FS_MONTH_SUFFIX = 11;
  const FS_WEEK = 12;                        // 周表头
  const FS_DAY = 13;                         // 日期数字（加粗）
  const FS_EVENT = 18;                       // 事项文本
  const EVENT_LINE_H = 24;
  const FS_EVENT_BIG = 16;
  const FS_FOOTER = 15;                      // 底部文本继续加大

  /* ============================================================
   * 2. 运行时状态
   * ============================================================ */
  let userScale = 1;
  let scale = 1;
  let dpr = 1;
  let apiKey = '';
  let deviceId = '';
  let codeRafId = 0;

  let state = {
    year: new Date().getFullYear(),
    month: new Date().getMonth() + 1,
    eventText: '',
    impMonth: 1,
    impDay: 1,
    footer: ''
  };

  /* ============================================================
   * 3. DOM 引用
   * ============================================================ */
  let paneCenter, previewWrap, canvasEl, ctx;
  let selYear, selMonth, inpEvent, selImpMonth, selImpDay, inpFooter;
  let codeBox, sendBtn, statusBox, deviceBtn;
  let modalMask, inpKey, inpDevice, saveBtn, cancelBtn, modalHint;

  /* ============================================================
   * 4. 入口
   * ============================================================ */
  document.addEventListener('DOMContentLoaded', init);

  function init() {
    cacheDom();
    buildSelectors();
    bindEvents();
    bindZoomGuards();

    loadScene();
    applyStateToInputs();

    fitPreview();
    renderAll();

    /* 最后一步：配置检查 */
    const cfg = loadConfig();
    if (cfg) {
      apiKey = cfg.apiKey;
      deviceId = cfg.deviceId;
      updateDeviceBtn();
    } else {
      deviceBtn.textContent = '未配置';
      openModal(true);
    }
  }

  function cacheDom() {
    paneCenter  = document.getElementById('paneCenter');
    previewWrap = document.getElementById('previewWrap');
    canvasEl    = document.getElementById('preview');
    ctx         = canvasEl.getContext('2d');

    selYear     = document.getElementById('selYear');
    selMonth    = document.getElementById('selMonth');
    inpEvent    = document.getElementById('inpEvent');
    selImpMonth = document.getElementById('selImpMonth');
    selImpDay   = document.getElementById('selImpDay');
    inpFooter   = document.getElementById('inpFooter');

    codeBox     = document.getElementById('codeBox');
    sendBtn     = document.getElementById('sendBtn');
    statusBox   = document.getElementById('statusBox');
    deviceBtn   = document.getElementById('deviceBtn');

    modalMask   = document.getElementById('modalMask');
    inpKey      = document.getElementById('inpKey');
    inpDevice   = document.getElementById('inpDevice');
    saveBtn     = document.getElementById('saveBtn');
    cancelBtn   = document.getElementById('cancelBtn');
    modalHint   = document.getElementById('modalHint');
  }

  /* ============================================================
   * 5. 下拉框构建
   * ============================================================ */
  function buildSelectors() {
    const nowY = new Date().getFullYear();
    let opts = '';
    for (let y = nowY - 3; y <= nowY + 7; y++) {
      opts += '<option value="' + y + '">' + y + ' 年</option>';
    }
    selYear.innerHTML = opts;

    let mOpts = '';
    for (let m = 1; m <= 12; m++) {
      mOpts += '<option value="' + m + '">' + m + ' 月</option>';
    }
    selMonth.innerHTML = mOpts;
    selImpMonth.innerHTML = mOpts;

    rebuildDays(1, 1);
  }

  function rebuildDays(month, selectedDay) {
    const max = new Date(2024, month, 0).getDate(); // 2024 为闰年，2 月 29 天
    let opts = '';
    for (let d = 1; d <= max; d++) {
      opts += '<option value="' + d + '">' + d + ' 日</option>';
    }
    selImpDay.innerHTML = opts;
    const d = Math.min(Math.max(1, selectedDay || 1), max);
    selImpDay.value = String(d);
    return d;
  }

  function applyStateToInputs() {
    selYear.value = String(state.year);
    selMonth.value = String(state.month);
    selImpMonth.value = String(state.impMonth);
    state.impDay = rebuildDays(state.impMonth, state.impDay);
    inpEvent.value = state.eventText;
    inpFooter.value = state.footer;
  }

  /* ============================================================
   * 6. 事件绑定
   * ============================================================ */
  function bindEvents() {
    selYear.addEventListener('change', function () {
      state.year = parseInt(selYear.value, 10) || state.year;
      refresh();
    });

    selMonth.addEventListener('change', function () {
      state.month = parseInt(selMonth.value, 10) || state.month;
      refresh();
    });

    selImpMonth.addEventListener('change', function () {
      state.impMonth = parseInt(selImpMonth.value, 10) || 1;
      state.impDay = rebuildDays(state.impMonth, state.impDay);
      refresh();
    });

    selImpDay.addEventListener('change', function () {
      state.impDay = parseInt(selImpDay.value, 10) || 1;
      refresh();
    });

    inpEvent.addEventListener('input', function () {
      state.eventText = inpEvent.value;
      refresh();
    });

    inpFooter.addEventListener('input', function () {
      state.footer = inpFooter.value;
      refresh();
    });

    sendBtn.addEventListener('click', send);
    deviceBtn.addEventListener('click', function () { openModal(false); });
    saveBtn.addEventListener('click', saveConfig);
    cancelBtn.addEventListener('click', function () {
      modalMask.style.display = 'none';
    });

    window.addEventListener('resize', fitPreview);
  }

  function bindZoomGuards() {
    paneCenter.addEventListener('wheel', function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      userScale = Math.max(0.3, Math.min(4, userScale + delta));
      fitPreview();
    }, { passive: false });

    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturestart',  function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend',    function (e) { e.preventDefault(); });
  }

  /* ============================================================
   * 7. 刷新管线
   * ============================================================ */
  function refresh() {
    drawPreview();
    scheduleCodeUpdate();
    saveScene();
  }

  function renderAll() {
    drawPreview();
    updateCode();
    saveScene();
  }

  function scheduleCodeUpdate() {
    if (codeRafId) return;
    codeRafId = requestAnimationFrame(function () {
      codeRafId = 0;
      updateCode();
    });
  }

  /* ============================================================
   * 8. 预览缩放
   * ============================================================ */
  function autoScale() {
    const availW = paneCenter.clientWidth - 90;
    const availH = paneCenter.clientHeight - 110;
    if (availW <= 0 || availH <= 0) return 1;
    return Math.max(0.6, Math.min(3, Math.min(availW / CANVAS_W, availH / CANVAS_H)));
  }

  function fitPreview() {
    scale = autoScale() * userScale;
    dpr = window.devicePixelRatio || 1;

    canvasEl.width  = Math.round(CANVAS_W * dpr);
    canvasEl.height = Math.round(CANVAS_H * dpr);
    canvasEl.style.width  = Math.round(CANVAS_W * scale) + 'px';
    canvasEl.style.height = Math.round(CANVAS_H * scale) + 'px';

    drawPreview();
  }

  /* ============================================================
   * 9. 日历数据（周日 = 0）
   * ============================================================ */
  function buildCells(year, month) {
    const first = new Date(year, month - 1, 1);
    const offset = first.getDay();                     // 周日 = 0
    const days = new Date(year, month, 0).getDate();
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const d = i - offset + 1;
      cells.push(d >= 1 && d <= days ? d : null);
    }
    return cells;
  }

  function colRect(i) {
    const l = Math.round(GRID_START_X + GRID_COL_W * i);
    const r = Math.round(GRID_START_X + GRID_COL_W * (i + 1));
    return { x: l, w: r - l };
  }

  function pad2(n) {
    return n < 10 ? '0' + n : String(n);
  }

  /* ============================================================
   * 10. Canvas 预览绘制
   * ============================================================ */
  function drawPreview() {
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, CANVAS_W, CANVAS_H);

    const FONT = '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';

    /* 背景 */
    c.fillStyle = '#ffffff';
    c.fillRect(0, 0, CANVAS_W, CANVAS_H);

    /* --- 月份数字（左上，保持较大） --- */
    c.fillStyle = '#000000';
    c.textBaseline = 'middle';
    c.textAlign = 'left';
    c.font = 'bold ' + FS_MONTH + 'px ' + FONT;
    c.fillText(String(state.month), 8, 20);

    /* --- 月份后缀「月」 --- */
    c.font = FS_MONTH_SUFFIX + 'px ' + FONT;
    c.fillText('月', 42, 23);

    /* --- 周表头（日一二三四五六，加粗） --- */
    c.textAlign = 'center';
    c.font = 'bold ' + FS_WEEK + 'px ' + FONT;
    for (let i = 0; i < 7; i++) {
      const r = colRect(i);
      c.fillText(WEEK[i], r.x + r.w / 2, 43);
    }

    /* --- 日期网格（加粗） --- */
    c.font = 'bold ' + FS_DAY + 'px ' + FONT;
    const cells = buildCells(state.year, state.month);
    for (let row = 0; row < 6; row++) {
      for (let col = 0; col < 7; col++) {
        const v = cells[row * 7 + col];
        if (v === null) continue;
        const r = colRect(col);
        c.fillText(String(v), r.x + r.w / 2, GRID_TOP + GRID_ROW_H * row + GRID_ROW_H / 2);
      }
    }

    /* --- 右栏：事项（上，占 2/3，垂直居中） --- */
    const rx = LEFT_W + 6;
    const rw = RIGHT_W - 12;
    const rcx = rx + rw / 2;

    c.font = FS_EVENT + 'px ' + FONT;
    c.textAlign = 'center';
    const lines = wrapText(c, state.eventText, rw, EVENT_MAX_LINES);
    const startY = EVENT_BOX_TOP + EVENT_BOX_H / 2 - (lines.length - 1) * EVENT_LINE_H / 2;
    for (let i = 0; i < lines.length; i++) {
      c.fillText(lines[i], rcx, startY + i * EVENT_LINE_H);
    }

    /* --- 右栏：月日（下，占 1/3，垂直居中） --- */
    c.font = 'bold ' + FS_EVENT_BIG + 'px ' + FONT;
    c.fillText(
      pad2(state.impMonth) + '/' + pad2(state.impDay),
      rcx,
      DATE_BOX_TOP + DATE_BOX_H / 2
    );

    /* --- 底部文本 --- */
    c.fillStyle = '#ffffff';
    c.fillRect(0, CAL_H, CANVAS_W, BOTTOM_H);
    c.fillStyle = '#000000';
    c.font = FS_FOOTER + 'px ' + FONT;
    c.textAlign = 'center';
    c.fillText(state.footer, CANVAS_W / 2, CAL_H + 1 + (BOTTOM_H - 1) / 2);

    /* --- 分割线 --- */
    c.fillStyle = '#000000';
    c.fillRect(LEFT_W, 0, 1, CAL_H);
    c.fillRect(0, CAL_H, CANVAS_W, 1);
  }

  /* 先按 \n 分段，再逐段自动折行，最多取 maxLines 行；超出行尾部加省略号 */
  function wrapText(c, text, maxWidth, maxLines) {
    const src = String(text == null ? '' : text);
    if (!src) return [];

    const rawLines = src.split('\n');
    const out = [];

    for (let li = 0; li < rawLines.length; li++) {
      const para = rawLines[li];
      if (para === '') {
        out.push('');
        if (out.length >= maxLines) return clipLast(out, maxWidth);
        continue;
      }

      let cur = '';
      for (let i = 0; i < para.length; i++) {
        const ch = para[i];
        const test = cur + ch;
        if (cur && c.measureText(test).width > maxWidth) {
          out.push(cur);
          if (out.length >= maxLines) return clipLast(out, maxWidth);
          cur = ch;
        } else {
          cur = test;
        }
      }
      if (cur) {
        out.push(cur);
        if (out.length >= maxLines) return clipLast(out, maxWidth);
      }
    }

    return out;
  }

  function clipLast(out, maxWidth) {
    const lines = out.slice(0, EVENT_MAX_LINES);
    const hasMore = out.length > EVENT_MAX_LINES;
    if (hasMore) {
      let last = lines[EVENT_MAX_LINES - 1];
      while (last.length > 0 && ctx.measureText(last + '…').width > maxWidth) {
        last = last.slice(0, -1);
      }
      lines[EVENT_MAX_LINES - 1] = last + '…';
    }
    return lines;
  }

  /* ============================================================
   * 11. JSON 生成
   * ============================================================ */
  function elStyle(x, y, w, h, extra) {
    const s = {
      position: 'absolute',
      left: Math.round(x) + 'px',
      top: Math.round(y) + 'px',
      width: Math.round(w) + 'px',
      height: Math.round(h) + 'px',
      overflow: 'hidden'
    };
    if (extra) {
      for (const k in extra) {
        if (Object.prototype.hasOwnProperty.call(extra, k)) s[k] = extra[k];
      }
    }
    return s;
  }

  function textNode(x, y, w, h, text, fontSize, opts) {
    opts = opts || {};
    return {
      type: 'div',
      props: {
        style: elStyle(x, y, w, h, {
          display: 'flex',
          alignItems: 'center',
          justifyContent: opts.align === 'left' ? 'flex-start'
                       : opts.align === 'right' ? 'flex-end' : 'center',
          fontSize: fontSize + 'px',
          fontWeight: opts.bold ? 'bold' : 'normal',
          lineHeight: (opts.lineHeight || Math.round(fontSize * 1.3)) + 'px',
          color: '#000000',
          backgroundColor: '#ffffff',
          textAlign: opts.align || 'center',
          whiteSpace: 'pre-wrap',
          wordBreak: 'break-word'
        }),
        children: String(text == null ? '' : text)
      }
    };
  }

  function rectNode(x, y, w, h, color) {
    return {
      type: 'div',
      props: {
        style: elStyle(x, y, w, h, { backgroundColor: color || '#000000' }),
        children: ''
      }
    };
  }

  function buildChildren() {
    const out = [];

    /* 月份数字 */
    out.push(textNode(8, 2, 34, 36, String(state.month), FS_MONTH, { bold: true, align: 'left' }));
    /* 月份后缀 */
    out.push(textNode(42, 14, 16, 20, '月', FS_MONTH_SUFFIX, { align: 'left' }));

    /* 周表头（日一二三四五六，加粗） */
    for (let i = 0; i < 7; i++) {
      const r = colRect(i);
      out.push(textNode(r.x, 37, r.w, 12, WEEK[i], FS_WEEK, { bold: true }));
    }

    /* 日期网格（加粗） */
    const cells = buildCells(state.year, state.month);
    for (let row = 0; row < 6; row++) {
      for (let col = 0; col < 7; col++) {
        const v = cells[row * 7 + col];
        if (v === null) continue;
        const r = colRect(col);
        out.push(textNode(r.x, GRID_TOP + GRID_ROW_H * row, r.w, GRID_ROW_H, String(v), FS_DAY, { bold: true }));
      }
    }

    /* 右栏事项（上，占 2/3；保留换行，最多 3 行） */
    out.push(textNode(
      LEFT_W + 6, EVENT_BOX_TOP,
      RIGHT_W - 12, EVENT_BOX_H,
      state.eventText,
      FS_EVENT,
      { lineHeight: EVENT_LINE_H }
    ));

    /* 右栏月日（下，占 1/3） */
    out.push(textNode(
      LEFT_W + 6, DATE_BOX_TOP,
      RIGHT_W - 12, DATE_BOX_H,
      pad2(state.impMonth) + '/' + pad2(state.impDay),
      FS_EVENT_BIG, { bold: true }
    ));

    /* 底部文本 */
    out.push(textNode(0, CAL_H + 1, CANVAS_W, BOTTOM_H - 1, state.footer, FS_FOOTER, {}));

    /* 分割线 */
    out.push(rectNode(LEFT_W, 0, 1, CAL_H, '#000000'));
    out.push(rectNode(0, CAL_H, CANVAS_W, 1, '#000000'));

    return out;
  }

  function buildBody() {
    return {
      refreshNow: true,
      taskAlias: '日历',
      border: 0,
      data: {},
      windowData: {
        default: [{
          type: 'div',
          props: {
            tw: 'flex flex-col w-full h-full min-w-0 min-h-0',
            style: {
              backgroundColor: '#ffffff',
              color: '#000000',
              position: 'relative'
            },
            children: buildChildren()
          }
        }]
      },
      layoutFull: { tw: 'p-0' }
    };
  }

  function updateCode() {
    codeBox.textContent = JSON.stringify(buildBody(), null, 2);
  }

  /* ============================================================
   * 12. 持久化
   * ============================================================ */
  function saveScene() {
    try {
      localStorage.setItem(SCENE_KEY, JSON.stringify(state));
    } catch (e) {
      /* 忽略写入失败 */
    }
  }

  function loadScene() {
    try {
      const raw = localStorage.getItem(SCENE_KEY);
      if (!raw) return false;
      const o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return false;

      const now = new Date();
      const y = parseInt(o.year, 10);
      const m = parseInt(o.month, 10);

      state.year  = (y >= 2000 && y <= 2100) ? y : now.getFullYear();
      state.month = (m >= 1 && m <= 12) ? m : now.getMonth() + 1;
      state.eventText = typeof o.eventText === 'string' ? o.eventText : '';

      const im = parseInt(o.impMonth, 10);
      const id = parseInt(o.impDay, 10);
      state.impMonth = (im >= 1 && im <= 12) ? im : 1;

      const maxDay = new Date(2024, state.impMonth, 0).getDate();
      state.impDay = (id >= 1 && id <= maxDay) ? id : 1;

      state.footer = typeof o.footer === 'string' ? o.footer : '';
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadConfig() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return null;
      if (typeof o.apiKey !== 'string' || typeof o.deviceId !== 'string') return null;
      if (!o.apiKey.trim() || !o.deviceId.trim()) return null;
      return { apiKey: o.apiKey.trim(), deviceId: o.deviceId.trim() };
    } catch (e) {
      return null;
    }
  }

  /* ============================================================
   * 13. 配置弹窗
   * ============================================================ */
  function openModal(required) {
    modalMask.style.display = 'flex';
    cancelBtn.style.display = required ? 'none' : 'inline-block';
    inpKey.value = apiKey;
    inpDevice.value = deviceId;
    modalHint.textContent = required ? '首次使用，请先完成配置' : '';
    setTimeout(function () { inpKey.focus(); }, 30);
  }

  function saveConfig() {
    const k = inpKey.value.trim();
    const d = inpDevice.value.trim();
    if (!k || !d) {
      modalHint.textContent = 'API 密钥与设备序列号都必填';
      return;
    }
    apiKey = k;
    deviceId = d;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ apiKey: k, deviceId: d }));
      modalHint.textContent = '配置已保存到本机';
    } catch (e) {
      modalHint.textContent = '保存失败：浏览器存储不可用';
      return;
    }
    updateDeviceBtn();
    modalMask.style.display = 'none';
    setStatus('配置已保存到本机');
  }

  function updateDeviceBtn() {
    if (!deviceId) {
      deviceBtn.textContent = '未配置';
      return;
    }
    deviceBtn.textContent = deviceId.length > 14 ? deviceId.slice(0, 14) + '…' : deviceId;
  }

  /* ============================================================
   * 14. 发送
   * ============================================================ */
  function setStatus(msg) {
    statusBox.textContent = msg;
  }

  function send() {
    if (!apiKey || !deviceId) {
      openModal(true);
      return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = '发送中…';
    setStatus('发送中…');

    const endpoint = 'https://dot.mindreset.tech/api/authV2/open/device/'
                     + encodeURIComponent(deviceId) + '/canvas';

    fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify(buildBody())
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        const msg = (data && data.message) ? data.message : ('HTTP ' + res.status);
        setStatus((res.ok ? '发送成功：' : '发送失败：') + msg);
      });
    }).catch(function (err) {
      setStatus('发送失败：' + (err && err.message ? err.message : '网络错误'));
    }).then(function () {
      sendBtn.disabled = false;
      sendBtn.textContent = '发送到画板';
    });
  }

})();
</script>
</body>
